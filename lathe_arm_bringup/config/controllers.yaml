controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    linkage_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints: [j1_base_yaw, j2_boom_lift, j3_wrist_pitch, j4_wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 5.0

gripper_controller:
  ros__parameters:
    joints: [j5_gripper, j5_gripper_mirror]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 3.0

# Drives the drawn actuator (act_pitch, act_extend) from the boom angle; see linkage_node.
linkage_controller:
  ros__parameters:
    joints: [act_pitch, act_extend]
    interface_name: position
