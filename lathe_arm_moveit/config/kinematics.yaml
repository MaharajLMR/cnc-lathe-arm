arm:
  # KDL analytical IK, fast, exact for chains with all-revolute joints
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005   # rad
  kinematics_solver_timeout: 0.05              # seconds per IK call
  kinematics_solver_attempts: 3

  # Uncomment to use TRAC-IK instead (handles near-singularities better):
  # kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  # kinematics_solver_timeout: 0.05
  # kinematics_solver_type: Speed
