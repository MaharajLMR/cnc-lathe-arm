# MoveIt joint limits override (per-joint velocity & acceleration caps).
# Position limits come from the URDF; override them here only if needed.

joint_limits:
  joint_1_base_shoulder:
    has_velocity_limits: true
    max_velocity: 1.0          # rad/s  (motor rated)
    has_acceleration_limits: true
    max_acceleration: 2.0      # rad/s²

  joint_2_shoulder_upper:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0

  joint_3_upper_elbow:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0

  joint_4_elbow_wrist:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0

  joint_5_wrist_roll:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 5.0
