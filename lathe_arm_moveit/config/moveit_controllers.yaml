# Maps MoveIt trajectory execution to the ros2_control JointTrajectoryController.
moveit_controller_manager: moveit_ros_control_interface::MoveItControllerManager

controller_names:
  - lathe_arm_controller

lathe_arm_controller:
  type: FollowJointTrajectory
  action_ns: follow_joint_trajectory
  default: true
  joints:
    - joint_1_base_shoulder
    - joint_2_shoulder_upper
    - joint_3_upper_elbow
    - joint_4_elbow_wrist
    - joint_5_wrist_roll
