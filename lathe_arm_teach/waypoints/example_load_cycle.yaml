# Load one part into the lathe chuck.
# Joints: base yaw, boom lift, wrist pitch, wrist roll (rad), gripper (m per finger).
# Wrist pitch = -boom keeps the gripper hanging straight down.
# Gripper 0.030 = open, 0.0215 = closed on the 50 mm part.

waypoints:
  - name: home
    joints: [0.0, 0.1745, -0.1745, 0.0, 0.030]
  - name: above_part
    joints: [-0.6109, -0.2094, 0.2094, 0.0, 0.030]
  - name: at_part
    joints: [-0.6109, -0.4189, 0.4189, 0.0, 0.030]
  - name: grip
    joints: [-0.6109, -0.4189, 0.4189, 0.0, 0.0215]
  - name: lift
    joints: [-0.6109, -0.0873, 0.0873, 0.0, 0.0215]
  - name: swing_to_lathe
    joints: [0.9599, -0.0873, 0.0873, 0.0, 0.0215]
  - name: above_chuck
    joints: [0.9599, -0.1396, 0.1396, 0.0, 0.0215]
  - name: at_chuck
    joints: [0.9599, -0.3491, 0.3491, 0.0, 0.0215]
  - name: release
    joints: [0.9599, -0.3491, 0.3491, 0.0, 0.030]
  - name: clear
    joints: [0.9599, -0.1396, 0.1396, 0.0, 0.030]
  - name: home
    joints: [0.0, 0.1745, -0.1745, 0.0, 0.030]
